<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Script Cleaner - Auto-Save & Auto-Delete</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            max-width: 1600px;
            margin: 20px auto;
            padding: 20px;
        }
        h2 { color: #fff; text-align: center; }
        p { text-align: center; color: #aaa; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .primary-btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            flex: 2;
        }
        .primary-btn:hover { background-color: #005999; }

        .reset-btn {
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        .reset-btn:hover { background-color: #991b1b; }
        
        .columns-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            align-items: start;
        }
        
        .column-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 6px;
            background-color: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 0.75rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .column-results-container {
            background-color: #252526;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            min-height: 250px;
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .item-text { 
            font-size: 0.75rem; 
            word-break: break-word; 
            margin-bottom: 6px; 
        }
        .copy-btn {
            background-color: #107c10;
            color: white;
            border: none;
            padding: 4px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7rem;
            width: 100%;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .copy-btn:hover { background-color: #0e630e; }
        .copied { background-color: #555 !important; }
        .empty-msg { font-size: 0.75rem; color: #777; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Universal Script Cleaner (Auto-Save Enabled)</h2>
    <p>Your inputs and remaining cards are automatically saved. Come back anytime and pick up right where you left off!</p>

    <div class="btn-group">
        <button class="primary-btn" onclick="processText()">Clean & Generate All Columns</button>
        <button class="reset-btn" onclick="resetEverything()">🗑️ Reset / Clear All Data</button>
    </div>

    <div class="columns-container">
        <script>
            for (let i = 1; i <= 10; i++) {
                document.write(`
                    <div class="column-wrapper">
                        <textarea id="input-${i}" placeholder="Input ${i}" oninput="saveInputs()"></textarea>
                        <div id="results-${i}" class="column-results-container">
                            <div class="empty-msg">No output yet</div>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <script>
        // Save textarea inputs to localStorage automatically on typing
        function saveInputs() {
            for (let i = 1; i <= 10; i++) {
                const val = document.getElementById(`input-${i}`).value;
                localStorage.setItem(`script_cleaner_input_${i}`, val);
            }
        }

        // Save current card states for each column to localStorage
        function saveColumnState(colIndex) {
            const resultsDiv = document.getElementById(`results-${colIndex}`);
            const cards = resultsDiv.querySelectorAll('.item-card');
            let itemsToSave = [];
            cards.forEach(card => {
                itemsToSave.push(card.getAttribute('data-text'));
            });
            localStorage.setItem(`script_cleaner_cards_${colIndex}`, JSON.stringify(itemsToSave));
        }

        // Load saved data when the page opens
        window.onload = function() {
            for (let i = 1; i <= 10; i++) {
                // Restore inputs
                const savedInput = localStorage.getItem(`script_cleaner_input_${i}`);
                if (savedInput !== null) {
                    document.getElementById(`input-${i}`).value = savedInput;
                }

                // Restore remaining cards if any were generated/saved
                const savedCards = localStorage.getItem(`script_cleaner_cards_${i}`);
                const resultsDiv = document.getElementById(`results-${i}`);
                resultsDiv.innerHTML = '';

                if (savedCards) {
                    const items = JSON.parse(savedCards);
                    if (items.length > 0) {
                        items.forEach((item, index) => {
                            renderCard(resultsDiv, item, index + 1, i);
                        });
                    } else {
                        resultsDiv.innerHTML = '<div class="empty-msg">All items copied!</div>';
                    }
                } else {
                    resultsDiv.innerHTML = '<div class="empty-msg">No output yet</div>';
                }
            }
        };

        function processText() {
            for (let i = 1; i <= 10; i++) {
                const textarea = document.getElementById(`input-${i}`);
                const resultsDiv = document.getElementById(`results-${i}`);
                resultsDiv.innerHTML = '';

                const rawText = textarea.value;
                if (!rawText.trim()) {
                    resultsDiv.innerHTML = '<div class="empty-msg">No output yet</div>';
                    localStorage.removeItem(`script_cleaner_cards_${i}`);
                    continue;
                }

                const blocks = rawText.split(/\n\s*\n/);
                let columnItems = [];

                blocks.forEach(block => {
                    let trimmedBlock = block.trim();
                    if (!trimmedBlock) return;

                    const lines = trimmedBlock.split('\n');
                    let sentenceParts = [];

                    lines.forEach(line => {
                        let stripped = line.trim();
                        if (stripped) {
                            sentenceParts.push(stripped);
                        }
                    });

                    if (sentenceParts.length > 0) {
                        columnItems.push(sentenceParts.join(' '));
                    }
                });

                if (columnItems.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-msg">No valid text</div>';
                    continue;
                }

                columnItems.forEach((item, index) => {
                    renderCard(resultsDiv, item, index + 1, i);
                });

                saveColumnState(i);
            }
        }

        function renderCard(container, itemText, indexNum, colNum) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.setAttribute('data-text', itemText);

            const textSpan = document.createElement('div');
            textSpan.className = 'item-text';
            textSpan.textContent = `[${indexNum}] ${itemText}`;

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.textContent = 'Copy';
            
            copyBtn.onclick = function() {
                navigator.clipboard.writeText(itemText).then(() => {
                    copyBtn.textContent = 'Copied!';
                    copyBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.9)';
                        setTimeout(() => {
                            card.remove();
                            saveColumnState(colNum); // Update saved state after deletion
                            
                            if (container.children.length === 0) {
                                container.innerHTML = '<div class="empty-msg">All items copied!</div>';
                            }
                        }, 300);
                    }, 400);
                });
            };

            card.appendChild(textSpan);
            card.appendChild(copyBtn);
            container.appendChild(card);
        }

        function resetEverything() {
            if (confirm("Are you sure you want to clear all inputs and saved progress?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
